aid: b612
name: B612
description: 'B612 is a consumer selfie and beauty camera application for iOS and Android, published
  globally by SNOW Corporation and operated in mainland China as B612咔叽 (B612 Kaji) by Yiruike Information
  Technology (Beijing) Co., Ltd. The app combines a real-time beauty camera, AR stickers and scene effects,
  user-created and creator-published filters, and photo and video editing tools, and has been distributed
  through the Apple App Store and Google Play since 2014. B612 is a mobile end-user product rather than
  an API provider: as of this enrichment pass the company publishes no developer portal, no public API
  documentation, no SDKs, and no machine-readable API artifacts on any of its web properties.'
